<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1b4a">
<title>Bom dia ☀️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,600&family=Nunito:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#4a1f3d; --rose:#e8506f; --paper:#fff8f0; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:'Nunito',-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); min-height:100vh;
    display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center;
    padding:24px; padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(24px,env(safe-area-inset-bottom)); overflow-x:hidden; background:#8a3a6e; }
  @supports (-webkit-touch-callout:none) { body { min-height:-webkit-fill-available; } }
  .sky { position:fixed; top:0; left:0; right:0; bottom:0; z-index:-2;
    background:linear-gradient(180deg,#2b1b4a 0%,#8a3a6e 28%,#f0707f 58%,#ffb57a 82%,#ffe3a3 100%); }
  .sun { position:fixed; left:50%; bottom:-150px; width:340px; height:340px; margin-left:-170px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle,#fff6d6 0%,#ffd27a 45%,rgba(255,210,122,0) 70%); }

  #splash { position:fixed; top:0; left:0; right:0; bottom:0; z-index:10; overflow:hidden; cursor:pointer;
    background:linear-gradient(180deg,#2b1b4a 0%,#8a3a6e 30%,#f0707f 60%,#ffb57a 85%,#ffe3a3 100%);
    display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center;
    -webkit-transition:opacity 1s; transition:opacity 1s; }
  #splash.out { opacity:0; pointer-events:none; }
  .splash-text { position:relative; z-index:2; text-align:center; color:#fff; padding:24px; opacity:0;
    -webkit-transition:opacity 1.6s; transition:opacity 1.6s; text-shadow:0 2px 14px rgba(43,27,74,.55); }
  .splash-text.on { opacity:1; }
  .splash-text b { display:block; font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600; font-size:30px; line-height:1.15; }
  .splash-text span { display:block; margin-top:10px; font-weight:600; letter-spacing:.03em; }
  .splash-skip { position:absolute; bottom:calc(28px + env(safe-area-inset-bottom)); left:50%; z-index:3; margin-left:-110px; width:220px; text-align:center;
    padding:14px 0; border-radius:999px; background:#4a1f3d; color:#fff; font-weight:700; font-size:1.05rem; letter-spacing:.02em;
    border:2px solid #fff; box-shadow:0 8px 24px rgba(43,27,74,.45); -webkit-animation:pulse2 1.6s ease-in-out infinite; animation:pulse2 1.6s ease-in-out infinite; }
  @-webkit-keyframes pulse2 { 50% { -webkit-transform:scale(1.07); transform:scale(1.07); } } @keyframes pulse2 { 50% { -webkit-transform:scale(1.07); transform:scale(1.07); } }
  .bird { position:absolute; top:0; left:0; z-index:1; color:#fff3dc; will-change:transform; }
  .bird svg { display:block; width:100%; height:100%; overflow:visible; -webkit-transform-origin:50% 85%; transform-origin:50% 85%;
    -webkit-filter:drop-shadow(0 2px 4px rgba(43,27,74,.35)); filter:drop-shadow(0 2px 4px rgba(43,27,74,.35)); }

  #envelope-wrap { position:relative; z-index:2; text-align:center; -webkit-transition:opacity .6s,-webkit-transform .6s; transition:opacity .6s,transform .6s; }
  #envelope-wrap.wait { opacity:0; pointer-events:none; }
  #envelope-wrap.gone { opacity:0; -webkit-transform:scale(.9); transform:scale(.9); pointer-events:none; }
  .envelope { position:relative; display:block; margin:0 auto; width:300px; max-width:80vw; height:200px; height:calc(min(300px,80vw) * .6667);
    cursor:pointer; background:none; border:0; padding:0; font:inherit; }
  .envelope:focus-visible { outline:3px solid #fff; outline-offset:8px; }
  .env-back { position:absolute; top:0; left:0; right:0; bottom:0; background:#d9768a; border-radius:8px; box-shadow:0 20px 50px rgba(43,27,74,.4); }
  .env-letter { position:absolute; left:8%; right:8%; top:8%; height:80%; background:var(--paper); border-radius:6px; text-align:center; line-height:1.25; padding:16px 8px 0;
    font-family:'Fraunces',Georgia,serif; font-style:italic; color:var(--rose); font-size:15px;
    -webkit-transition:-webkit-transform .9s .6s ease; transition:transform .9s .6s ease; }
  .env-front { position:absolute; top:0; left:0; right:0; bottom:0; z-index:3; border-radius:8px; overflow:hidden; }
  .env-front i { position:absolute; display:block; }
  .env-front .l { left:0; top:0; bottom:0; width:50%; background:#e98a9c; -webkit-clip-path:polygon(0 0,100% 50%,0 100%); clip-path:polygon(0 0,100% 50%,0 100%); }
  .env-front .r { right:0; top:0; bottom:0; width:50%; background:#e98a9c; -webkit-clip-path:polygon(100% 0,0 50%,100% 100%); clip-path:polygon(100% 0,0 50%,100% 100%); }
  .env-front .b { left:0; right:0; bottom:0; height:62%; background:#ee9aa9; -webkit-clip-path:polygon(0 100%,100% 100%,50% 0); clip-path:polygon(0 100%,100% 100%,50% 0); }
  .env-flap { position:absolute; left:0; right:0; top:0; height:58%; z-index:4; background:#c9596f; -webkit-clip-path:polygon(0 0,100% 0,50% 100%); clip-path:polygon(0 0,100% 0,50% 100%);
    -webkit-transform-origin:top center; transform-origin:top center; -webkit-transition:-webkit-transform .7s ease; transition:transform .7s ease; }
  .seal { position:absolute; left:50%; top:46%; width:46px; height:46px; margin:-23px 0 0 -23px; z-index:5; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff7a93,#b8264a); color:#fff; font-size:20px; line-height:46px; text-align:center; box-shadow:0 3px 8px rgba(0,0,0,.3);
    -webkit-transition:opacity .3s; transition:opacity .3s; }
  .envelope.open .env-flap { -webkit-transform:scaleY(-1); transform:scaleY(-1); z-index:1; }
  .envelope.open .seal { opacity:0; }
  .envelope.open .env-letter { -webkit-transform:translateY(-62%); transform:translateY(-62%); }
  .hint { display:inline-block; margin-top:28px; padding:12px 22px; border-radius:999px; background:#4a1f3d; color:#fff; font-weight:700; font-size:1.02rem; border:2px solid #fff; box-shadow:0 8px 24px rgba(43,27,74,.4); }
  .pulse { -webkit-animation:pulse 1.8s ease-in-out infinite; animation:pulse 1.8s ease-in-out infinite; }
  @-webkit-keyframes pulse { 50% { opacity:.55; } } @keyframes pulse { 50% { opacity:.55; } }

  .card { position:relative; z-index:2; max-width:460px; width:100%; text-align:center; display:none;
    background:rgba(255,248,240,.93); border-radius:28px; padding:40px 28px; box-shadow:0 20px 60px rgba(43,27,74,.35);
    opacity:0; -webkit-transform-origin:center top; transform-origin:center top; -webkit-transform:scaleY(.12); transform:scaleY(.12);
    -webkit-transition:opacity .9s ease,-webkit-transform 1s cubic-bezier(.2,.8,.2,1); transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1); }
  .card.show { display:block; }
  .card.in { opacity:1; -webkit-transform:none; transform:none; }
  .foto { display:block; width:128px; height:128px; margin:0 auto 20px; border-radius:50%; object-fit:cover; border:4px solid #fff;
    box-shadow:0 0 0 3px var(--rose),0 12px 28px rgba(43,27,74,.3); background:#f6d9de; }
  h1 { font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600; font-size:38px; line-height:1.1; color:var(--rose); }
  .full { margin-top:8px; font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:300; font-size:1.1rem; opacity:.85; }
  .msg { margin-top:22px; font-size:1.08rem; line-height:1.7; min-height:6em; }
  .msg p { margin-bottom:.8em; }
  .more { margin-top:10px; font:inherit; font-weight:600; color:#fff; background:var(--rose); border:0; border-radius:999px; padding:14px 28px; cursor:pointer; box-shadow:0 6px 18px rgba(232,80,111,.45); }
  .more:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .sign { font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:300; font-size:1.3rem; margin-top:18px; }
  .made { margin-top:28px; padding-top:18px; border-top:1px dashed rgba(74,31,61,.25); }
  .made code { display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; color:var(--rose); background:rgba(232,80,111,.1); padding:3px 10px; border-radius:6px; }
  .made .hand { display:block; margin-top:8px; font-family:'Caveat',cursive,Georgia,serif; font-weight:600; font-size:1.55rem; line-height:1.2; }
  .music { margin-top:24px; display:none; }
  .music small { display:block; margin-bottom:8px; opacity:.75; }
  .music iframe { width:200px; height:113px; border:0; border-radius:14px; box-shadow:0 6px 18px rgba(43,27,74,.25); }
  .heart { position:fixed; top:0; left:0; z-index:1; pointer-events:none; will-change:transform; line-height:1; }
  .secret { position:absolute; right:12px; bottom:10px; width:36px; height:36px; border:0; background:none; color:var(--rose); font-size:18px; cursor:pointer;
    opacity:0; pointer-events:none; -webkit-transition:opacity 1s; transition:opacity 1s; }
  .card.in .secret { opacity:.16; pointer-events:auto; -webkit-transition-delay:3s; transition-delay:3s; }
  .card.in .secret:hover, .card.in .secret:active { opacity:.9; -webkit-transition-delay:0s; transition-delay:0s; }
  #game { position:fixed; top:0; left:0; right:0; bottom:0; z-index:40; display:none; background:#1d1233; align-items:center; justify-content:center;
    touch-action:none; -webkit-user-select:none; user-select:none; }
  #game.on { display:-webkit-flex; display:flex; }
  #gcv { display:block; }
  #gx { position:absolute; top:max(10px,env(safe-area-inset-top)); right:12px; z-index:3; width:40px; height:40px; border-radius:50%; border:2px solid #fff; background:rgba(74,31,61,.7); color:#fff; font-size:18px; cursor:pointer; }
  .pad { position:absolute; bottom:max(18px,env(safe-area-inset-bottom)); z-index:3; display:-webkit-flex; display:flex; }
  #pl { left:16px; } #pr { right:16px; }
  .pad button { width:68px; height:68px; margin:0 6px; border-radius:50%; border:2px solid rgba(255,255,255,.8); background:rgba(74,31,61,.55); color:#fff; font-size:26px; touch-action:none; }
  #gm { position:absolute; z-index:4; display:none; text-align:center; background:rgba(255,248,240,.96); border-radius:24px; padding:26px 24px; max-width:84vw; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #gm h2 { font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600; color:var(--rose); font-size:28px; }
  #gm p { margin:8px 0 16px; }
  #gm button { font:inherit; font-weight:600; color:#fff; background:var(--rose); border:0; border-radius:999px; padding:12px 22px; margin:4px; cursor:pointer; }
</style>
</head>
<body>
<div class="sky"></div>
<div class="sun" aria-hidden="true"></div>

<div id="splash" aria-hidden="true">
  <div id="birds"></div>
  <div class="splash-text" id="splashText"><b data-nome="completo">Elanie de Sousa Lima</b><span>Bom dia ☀️</span></div>
  <div class="splash-skip">Toque para continuar ›</div>
</div>

<div id="envelope-wrap" class="wait">
  <button class="envelope" id="envelope" type="button" aria-label="Abrir a carta">
    <div class="env-back"></div>
    <div class="env-letter">Para <span data-nome="completo">Elanie de Sousa Lima</span> 💌</div>
    <div class="env-front"><i class="l"></i><i class="r"></i><i class="b"></i></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </button>
  <p class="hint pulse">Chegou uma carta pra você. Toque para abrir 💌</p>
</div>

<script>
(function(){
  var linkYoutube  = "https://www.youtube.com/watch?v=P-FrQnI3slU";   
  var nomeCompleto = "Elanie de Sousa Lima";      
  var meuNome      = "Bruno Nunes da Silva";     
  var assinatura   = "— Bruno";
  var mensagens = [
    "Que o seu dia comece leve, com um café da manhã gostoso e um sorriso bonito.",
    "Eu torci para que hoje fosse um dia gentil com você.",
    "Saiba que alguém pensou em você assim que o sol nasceu.",
    "Tenha um dia lindo. Você merece todas as coisas boas.",
    "Com carinho, e com um sorriso que você nem está vendo daqui. 💛"
  ];

  var $ = function(id){ return document.getElementById(id); };
  var W = window.innerWidth, H = window.innerHeight;
  window.addEventListener("resize", function(){ W = window.innerWidth; H = window.innerHeight; });

  var primeiro = nomeCompleto.split(" ")[0];
  [].forEach.call(document.querySelectorAll("[data-nome]"), function(el){
    el.textContent = el.getAttribute("data-nome") === "primeiro" ? primeiro : nomeCompleto;
  });
  [].forEach.call(document.querySelectorAll("[data-bruno]"), function(el){ el.textContent = meuNome; });
  document.title = "Bom dia, " + primeiro + " ☀️";

  
  var raf = window.requestAnimationFrame || function(f){ return setTimeout(function(){ f(Date.now()); }, 16); };
  var items = [];   
  var rodando = false;
  function loop(now){
    for (var i = items.length - 1; i >= 0; i--) {
      if (!items[i].step(now)) { var el = items[i].el; if (el.parentNode) el.parentNode.removeChild(el); items.splice(i,1); }
    }
    if (items.length) raf(loop); else rodando = false;
  }
  function add(o){ items.push(o); if (!rodando) { rodando = true; raf(loop); } }

  var BIRD = '<svg viewBox="0 0 60 30"><path d="M1 12 C9 -1 22 0 30 15 C38 0 51 -1 59 12 C50 9 39 12 30 24 C21 12 10 9 1 12Z" fill="currentColor"/></svg>';
  function ave(delay){
    var s = (W < 600 ? 40 : 56) + Math.random()*(W < 600 ? 40 : 60);
    var el = document.createElement("div"); el.className = "bird"; el.innerHTML = BIRD;
    el.style.width = s + "px"; el.style.height = (s/2) + "px"; el.style.visibility = "hidden";
    $("birds").appendChild(el);
    var svg = el.firstChild, y0 = H*0.06 + Math.random()*H*0.62, rise = 30 + Math.random()*90,
        dur = 5200 + Math.random()*2200, ph = Math.random()*6, start = null, t0 = Date.now() + delay;
    add({ el: el, step: function(now){
      var t = Date.now() - t0; if (t < 0) return true;
      var p = t / dur; if (p >= 1) return false;
      var x = -s + p*(W + 2*s), y = y0 - p*rise + Math.sin(p*9 + ph)*10;
      var k = 0.62 + 0.48*Math.sin(t/55 + ph);
      el.style.visibility = "visible";
      el.style.webkitTransform = el.style.transform = "translate3d(" + x + "px," + y + "px,0)";
      svg.style.webkitTransform = svg.style.transform = "scaleY(" + k + ")";
      return true;
    }});
  }

  var EMO = ["💛","🧡","❤️","🌷"];
  var vivos = 0;
  function coracao(){
    if (vivos > 28) return;
    vivos++;
    var el = document.createElement("span"); el.className = "heart"; el.textContent = EMO[Math.floor(Math.random()*EMO.length)];
    var s = 16 + Math.random()*22; el.style.fontSize = s + "px"; document.body.appendChild(el);
    var x0 = Math.random()*(W - 30), v = 55 + Math.random()*70, sw = 8 + Math.random()*22, ph = Math.random()*6, t0 = Date.now();
    add({ el: el, step: function(){
      var t = (Date.now() - t0)/1000, y = -40 + v*t;
      if (y > H + 20) { vivos--; return false; }
      el.style.webkitTransform = el.style.transform = "translate3d(" + (x0 + Math.sin(t*1.6 + ph)*sw) + "px," + y + "px,0) rotate(" + (t*25) + "deg)";
      return true;
    }});
  }
  var chuva = null;
  function iniciaChuva(){ if (chuva) return; chuva = setInterval(coracao, 650); }

  for (var b = 0; b < 9; b++) ave(b*380);
  setTimeout(function(){ $("splashText").className = "splash-text on"; }, 700);
  var fim = false;
  function fechaSplash(){
    if (fim) return; fim = true;
    $("splash").className = "out"; $("envelope-wrap").className = "";
    setTimeout(function(){ var s = $("splash"); if (s.parentNode) s.parentNode.removeChild(s); }, 1100);
  }
  $("splash").addEventListener("click", fechaSplash);
  $("splash").addEventListener("touchend", fechaSplash);
  setTimeout(fechaSplash, 7000);

  function tocarMusica(){
    var m = linkYoutube.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
    if (!m) return;
    var f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + m[1] + "?autoplay=1&loop=1&playlist=" + m[1] + "&playsinline=1";
    f.setAttribute("allow", "autoplay; encrypted-media"); f.title = "Música";
    $("player").appendChild(f); $("music").style.display = "block";
  }

  var env = $("envelope"), abriu = false, card = $("card");
  env.addEventListener("click", function(){
    if (abriu) return; abriu = true;
    env.className = "envelope open";
    tocarMusica();   
    setTimeout(function(){
      $("envelope-wrap").className = "gone";
      setTimeout(function(){ $("envelope-wrap").style.display = "none"; }, 650);
      card.className = "card show";
      void card.offsetHeight;             
      card.className = "card show in";
      for (var k = 0; k < 14; k++) setTimeout(coracao, k*90);
      iniciaChuva();
    }, 1900);
  });

  var i = 0, msg = $("msg"), btn = $("btn");
  btn.addEventListener("click", function(){
    for (var k = 0; k < 12; k++) setTimeout(coracao, k*80);
    if (i < mensagens.length) { var p = document.createElement("p"); p.textContent = mensagens[i++]; msg.appendChild(p); }
    if (i >= mensagens.length && !$("sig")) {
      var s = document.createElement("p"); s.id = "sig"; s.className = "sign"; s.textContent = assinatura; msg.appendChild(s);
      btn.textContent = "Mais um 💛";
    }
  });
})();
</script>

(s.st||[]).forEach(function(q){for(y=14-q[1];y<14;y++)g[y][q[0]]="L"});
s.p.forEach(function(q){for(i=0;i<q[2];i++){g[q[1]][q[0]+i]=q[3];if(q[3]=="B"&&q[2]>1)hs.push({x:(q[0]+i)*T+8,y:(q[1]-2)*T+8})}});
(s.h||[]).forEach(function(q){for(i=0;i<q[2];i++)hs.push({x:(q[0]+i)*T+8,y:q[1]*T+8})});
